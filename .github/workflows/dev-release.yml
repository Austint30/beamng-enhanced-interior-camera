name: Dev Release

# Package the mod and publish a rolling development prerelease after every
# push to the dev branch. The release uses a single rolling tag (`dev`):
# each push deletes and recreates the prerelease at the new head commit, so
# the releases page stays clean and the download always reflects the latest
# dev state.
#
# The release notes list the commits since the previously released dev
# commit, with their (truncated) subjects. Because the rolling release is
# deleted each push, a persistent lightweight tag (`dev-last`) marks the
# last released commit; it is moved to the new head after each successful
# run. On the first tracked release it falls back to everything on dev that
# is not in master yet.

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for the changelog range)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Package the mod (PowerShell 7)
        shell: pwsh
        run: ./package.ps1

      - name: Verify package
        shell: pwsh
        run: |
          $zip = 'dist/austint30.enhanced-interior-camera.zip'
          if (-not (Test-Path $zip)) {
            Write-Error "package.ps1 did not produce the expected zip: $zip"
            exit 1
          }
          Write-Host "Packaged: $zip ($((Get-Item $zip).Length) bytes)"

      - name: Build changelog since the last release
        run: |
          git fetch --force origin +refs/tags/dev-last:refs/tags/dev-last 2>/dev/null || true
          if git rev-parse --verify --quiet refs/tags/dev-last >/dev/null; then
            BASE="dev-last"
          else
            BASE="origin/master" # first tracked release: everything not yet released
          fi
          CHANGELOG=$(git log --reverse --pretty=format:'%h%x09%s' "$BASE..HEAD" \
            | awk -F'\t' '{ if (length($2) > 80) $2 = substr($2, 1, 77) "..."; printf "- %s (%s)\n", $2, $1 }')
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="- (no new commits since the last release)"
          fi
          {
            echo "Automated development build of the \`dev\` branch."
            echo ""
            echo "## Changes since the last release"
            echo "$CHANGELOG"
            echo ""
            echo "## Installation"
            echo "1. Download **\`austint30.enhanced-interior-camera.zip\`** from the assets below."
            echo "2. Copy the zip — do not extract it — into your BeamNG mods folder, by default \`%LOCALAPPDATA%\\BeamNG\\BeamNG.drive\\current\\mods\\\` (yours may differ if you relocated the user folder); remove any older copy of the same zip first."
            echo "3. The enhanced interior camera replaces the stock occupant/driver cameras automatically. Enable the Arcade Chase Camera demo from the **EIC Settings** button in the pause-menu Mods tab."
          } > release-notes.md
          cat release-notes.md

      - name: Delete previous dev release (rolling tag)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete dev --yes --cleanup-tag || true

      - name: Create development release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          gh release create dev dist/austint30.enhanced-interior-camera.zip \
            --target "$GITHUB_SHA" \
            --title "Development Build ($SHORT_SHA)" \
            --notes-file release-notes.md \
            --prerelease

      - name: Move the changelog anchor to this commit
        run: |
          git tag -f dev-last HEAD
          git push -f origin refs/tags/dev-last
